id: crawl_challenge
name: Crawl Challenge
tagline: Navigate tight spaces to reach goal.
tags:
  - Mobility
objective: Build a creature that crawls to the goal.
reward: crawl_locomotion
default_world: hill_path
required_tools:
  - create_body
  - add_joint
  - add_motor
  - run_simulation
recommended_tools:
  - set_friction
  - set_density
  - inspect_score
goal:
  threshold_x: 6.0
# Starting world: a body "seed" the agent should turn into a crawling creature
# (add joints + motors), plus a goal marker at the threshold line. The seed body
# is dynamic, so the world simulates immediately.
scaffold:
  - id: torso
    shape: box
    position: [-5.0, 1.5]
    size: [1.4, 0.6]
    mass: 1.5
    color: "#6d28d9"
  - id: goal_marker
    shape: box
    position: [6.0, 1.2]
    size: [0.4, 1.6]
    static: true
    color: "#22c55e"
